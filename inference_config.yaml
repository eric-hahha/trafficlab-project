  test1:
    prior_dimensions: "measurements_visdrone_v2"

    frames:
      fps: 100
      max_frame: -1

    model:
      weights: "./models/yolo11s-visdrone-v2-ft.pt"
      device: mps
      verbose: false
      imgsz: 1280
      conf: 0.01
      iou: 0.5
      max_det: 800
      agnostic_nms: false
      half: true

    tracking:
      tracker_type: "default"
      persist: true
      track_high_thresh: 0.03
      track_low_thresh: 0.02
      new_track_thresh: 0.25
      match_thresh: 0.97
      track_buffer: 60
      fuse_score: true

    kinematics:
      displacement_threshold: 0.15

      heading_sampling_rate: 25
      heading_smoothing: "adaptive_ema"

      heading_ema:
        alpha_min: 0.01
        alpha_max: 0.1
        speed_ref: 2.0

      heading_min_speed_for_update: 0.05
      heading_max_jump: 2
      heading_recovery_frames: 40

      heading_cosine_weighting: true
      heading_cosine_min_angle: 5
      heading_cosine_max_angle: 20

      heading_sat_coords_weighting: true
      heading_sat_coords_jitter_radius: 0.3
      heading_sat_coords_jitter_frames: 20

      heading_freeze_on_lost: true
      heading_freeze_max_lost: 20

      speed_smoothing: "ema"
      speed_ema_alpha: 0.1

      motorcycle_filter:
        enabled: false
        process_noise_px: 3.0
        measurement_noise_px: 2.5
        longitudinal_noise_px: 2.0
        lateral_noise_px: 7.5
        initial_covariance: 25.0
        max_blend_offset_px: 12.0
        prediction_blend: 0.85
        longitudinal_blend: 0.65
        lateral_blend: 0.2
        velocity_blend: 0.12
        heading_lock_enabled: false
        heading_lock_window: 5
        heading_lock_angle_deg: 12.0
        heading_lock_speed_kmh: 5.0
        heading_lock_min_lateral_px: 1.0
        heading_lock_alpha: 0.12
        heading_lock_lateral_blend: 0.0

      lateral_correction:
        enabled: false
        vehicle_classes: ["motor", "two_wheeler"]
        threshold: 1.2
        strength: 0.75
        window_size: 9
        max_distance: 2.5
        aggressive_factor: 1.45
        prediction_weight: 0.3
        min_jump_lateral_px: 0.6
        shock_ratio_threshold: 6.0
        shock_lateral_px: 4.0
        shock_longitudinal_factor: 0.12
        shock_lateral_factor: 0.02
        adaptive_strength:
          enabled: true
          min_strength: 0.45
          max_strength: 1.0
          consecutive_threshold: 1
        quality_validation:
          enabled: true
          smoothness_threshold: 0.8
          log_corrections: true
