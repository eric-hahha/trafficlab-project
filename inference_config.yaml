  yolo_seg_tight_box_cpu:
      prior_dimensions: "measurements_visdrone_v2"

      # mask tight-box 底邊已貼近接地面，不再套 down_h 視差修正
      projection:
        ref_method: center_bottom_side
        proj_method: match

      frames:
        fps: 25
        max_frame: -1

      model:
        weights: "./models/yolo11m-seg.pt"
        type: "seg"
        classes:
          car: "car"
          motorcycle: "two_wheeler"
        device: cpu
        verbose: false
        imgsz: 960
        conf: 0.35
        iou: 0.5
        max_det: 600
        agnostic_nms: false
        half: false

      tracking:
        tracker_type: "bytetrack"
        persist: true
        track_high_thresh: 0.25
        track_low_thresh: 0.1
        new_track_thresh: 0.25
        match_thresh: 0.8
        track_buffer: 30
        fuse_score: true

      kinematics:
        displacement_threshold: 0.25

        heading_sampling_rate: 15
        heading_smoothing: "adaptive_ema"

        heading_ema:
          alpha_min: 0.05
          alpha_max: 0.4
          speed_ref: 3.0

        heading_min_speed_for_update: 0.1
        heading_max_jump: 5
        heading_recovery_frames: 10

        heading_cosine_weighting: true
        heading_cosine_min_angle: 10
        heading_cosine_max_angle: 30

        heading_sat_coords_weighting: true
        heading_sat_coords_jitter_radius: 0.5
        heading_sat_coords_jitter_frames: 8

